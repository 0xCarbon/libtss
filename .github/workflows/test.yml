name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Test (release)
        run: cargo test --workspace --release

  rn-jni-syntax:
    # Compiles the React Native JNI bridge against the Android NDK (bionic
    # headers) for the 64-bit ABIs, plus the runner JDK's jni.h with g++.
    # The iOS bridge (libtss-rn/ios/Libtss.mm) needs the iOS SDK and React
    # headers, so it is not compiled here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c

      - name: Syntax-check libtss-jni.cpp with the NDK
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ndk="$NDK_PATH"
          clang="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          test -x "$clang" || { echo "NDK clang++ not found under '$ndk'"; exit 1; }
          for target in aarch64-linux-android23 x86_64-linux-android23; do
            echo "== $target"
            "$clang" --target="$target" -std=c++17 -fsyntax-only -Wall -Wextra -Werror \
              libtss-rn/android/src/main/cpp/libtss-jni.cpp
          done

      - name: Syntax-check libtss-jni.cpp with host g++
        run: |
          g++ -std=c++17 -fsyntax-only -Wall -Wextra -Werror \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            libtss-rn/android/src/main/cpp/libtss-jni.cpp

  bindings:
    # Runs each language binding's tests against a release build of
    # libtss-ffi (debug builds make the DKLs23 tests slow).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        binding: [node, python, dotnet, go]
    env:
      LIBTSS_LIB: ${{ github.workspace }}/target/release/liblibtss_ffi.so
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: bindings-release

      - name: Build libtss-ffi (release)
        run: |
          cargo build --release -p libtss-ffi
          # Go links target/debug before target/release; drop any cached
          # debug archive so the fresh release build is used.
          rm -f target/debug/liblibtss_ffi.a target/debug/liblibtss_ffi.so

      - if: matrix.binding == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - if: matrix.binding == 'node'
        name: Node tests
        working-directory: libtss-node
        run: |
          npm ci
          npx tsc --noEmit -p tsconfig.json
          npx jest --runInBand

      - if: matrix.binding == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: matrix.binding == 'python'
        name: Python tests
        run: |
          python -m pip install pytest
          python -m pytest -q libtss-python/tests

      - if: matrix.binding == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - if: matrix.binding == 'dotnet'
        name: .NET tests
        # Release: optimized JIT, as shipped; the collection-based lifetime
        # tests can only observe early finalization there.
        run: dotnet test libtss-dotnet/tests/Libtss.Tests -c Release

      - if: matrix.binding == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: libtss-go/go.mod
      - if: matrix.binding == 'go'
        name: Go tests
        working-directory: libtss-go
        run: |
          go vet ./...
          go vet -tags libtss_testhooks ./...
          go test -tags libtss_testhooks -timeout 30m ./...

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin@0.32.7 --locked

      - name: Generate coverage
        run: cargo tarpaulin --workspace --out xml --out html --timeout 300

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            tarpaulin-report.html
            cobertura.xml
          retention-days: 14

  bench-smoke:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Benchmark smoke test
        run: cargo bench --workspace -- --test

  fuzz-smoke:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Seed fuzz workspace with tested dependencies
        run: cp Cargo.lock libtss-ffi/fuzz/Cargo.lock

      - name: Fuzz ffi_deserialize (60s)
        working-directory: libtss-ffi
        run: cargo +nightly fuzz run fuzz_ffi_deserialize -- -max_total_time=60

      - name: Fuzz ffi_sign (60s)
        working-directory: libtss-ffi
        run: cargo +nightly fuzz run fuzz_ffi_sign -- -max_total_time=60

      - name: Fuzz ffi_handle (60s)
        working-directory: libtss-ffi
        run: cargo +nightly fuzz run fuzz_ffi_handle -- -max_total_time=60

  cbindgen:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (generates header via build.rs)
        run: cargo build -p libtss-ffi

      - name: Verify header was generated
        run: test -f libtss-ffi/libtss.h

  cross-compile:
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            linker: aarch64-linux-gnu-gcc
            packages: gcc-aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Cross-compile build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --release -p libtss-ffi --target ${{ matrix.target }}

  android-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Android libraries
        run: bash scripts/build-android.sh

      - name: Upload jniLibs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-jniLibs
          path: jniLibs/
          retention-days: 7

