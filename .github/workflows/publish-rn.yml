name: Publish React Native Module

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  ios:
    uses: ./.github/workflows/rn-ios.yml

  publish:
    needs: ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall cargo-ndk --no-confirm

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Build Android aarch64
        run: cargo ndk --target aarch64-linux-android --platform 21 -- build --release -p libtss-ffi
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}

      - name: Build Android x86_64
        run: cargo ndk --target x86_64-linux-android --platform 21 -- build --release -p libtss-ffi
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}

      # The XCFramework the ios job built and smoke-tested.
      - uses: actions/download-artifact@v4
        with:
          name: libtss-rn-ios
          path: libtss-rn/ios

      - name: Bundle native artifacts
        run: |
          # Android
          mkdir -p libtss-rn/android/libs/aarch64-linux-android libtss-rn/android/libs/x86_64-linux-android libtss-rn/android/include
          cp target/aarch64-linux-android/release/liblibtss_ffi.a libtss-rn/android/libs/aarch64-linux-android/
          cp target/x86_64-linux-android/release/liblibtss_ffi.a libtss-rn/android/libs/x86_64-linux-android/
          cp libtss-ffi/libtss.h libtss-rn/android/include/
          # iOS: ios/LibtssFFI.xcframework and ios/include come from the ios job.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        working-directory: libtss-rn
        run: npm install

      - name: Test
        working-directory: libtss-rn
        run: npm test

      - name: Bump version
        working-directory: libtss-rn
        run: npm version ${{ inputs.version }} --no-git-tag-version

      - name: Build TypeScript
        working-directory: libtss-rn
        run: npm run build

      - name: Publish
        working-directory: libtss-rn
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
