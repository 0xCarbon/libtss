[workspace]
resolver = "2"
members = ["libtss", "libtss-ffi", "examples/tokio-tss"]
exclude = ["libtss-wasm", "libtss-dotnet", "libtss-python"]

[workspace.package]
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/0xCarbon/libtss"
publish = false

[workspace.dependencies]
frost-core = "3.0.0"
frost-secp256k1-tr = "3.0.0"
frost-secp256k1 = "3.0.0"
frost-ed25519 = "3.0.0"
frost-p256 = "3.0.0"
frost-ristretto255 = "3.0.0"
frost-ed448 = "3.0.0"
dkls23-secp256k1 = { version = "0.6.1", features = ["serde"] }
dkls23-secp256r1 = { version = "0.6.1", features = ["serde"] }
zeroize = { version = "1", features = ["derive"] }
slotmap = "1"
k256 = "0.14"
p256 = "0.14"
subtle = "2.6"
rand_core = { version = "0.6", features = ["getrandom"] }
